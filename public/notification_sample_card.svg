<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <defs>
    <!-- Spotify Style Rich Ambient Photo Gradient Background -->
    <linearGradient id="spotifyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1f14"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#09111e"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Radial Emerald Ambient Glow (Spotify-style Album Lighting) -->
    <radialGradient id="spotifyGlow" cx="15%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#1db954" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanAmbient" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing Accents -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="albumShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <style>
    .title-bold { font-family: -apple-system, BlinkMacSystemFont, "Circular Std", "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .title-med { font-family: -apple-system, BlinkMacSystemFont, "Circular Std", "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #ffffff; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Circular Std", "Segoe UI", Roboto, sans-serif; font-weight: 500; fill: #a1a1aa; }
    .mono-bold { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 800; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 600; }
    .spotify-green { fill: #1db954; }
  </style>

  <!-- Photo Background Base -->
  <rect x="0" y="0" width="800" height="440" rx="28" fill="url(#spotifyBg)"/>
  <!-- Ambient Glow Layers (gives that Spotify Canvas photo look) -->
  <rect x="0" y="0" width="800" height="440" rx="28" fill="url(#spotifyGlow)"/>
  <rect x="0" y="0" width="800" height="440" rx="28" fill="url(#cyanAmbient)"/>
  
  <!-- Subtle border outline -->
  <rect x="1" y="1" width="798" height="438" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top Spotify Player Header -->
  <g transform="translate(32, 28)">
    <!-- Spotify-style Wave Icon / Dot -->
    <circle cx="8" cy="14" r="5" fill="#1db954" filter="url(#neonGlow)"/>
    <text x="24" y="19" class="title-bold" font-size="15" letter-spacing="0.8">NUTRIPULSE LIVE PLAYER</text>
    <text x="240" y="19" class="sub-text" font-size="12">·  Spotify Photo Background Mode</text>
    
    <!-- Status Pill -->
    <rect x="550" y="2" width="154" height="26" rx="13" fill="rgba(29, 185, 84, 0.2)" stroke="rgba(29, 185, 84, 0.5)" stroke-width="1.2"/>
    <text x="627" y="19" class="mono-bold" font-size="11" text-anchor="middle" fill="#1db954">
      🎯 GOAL ON TRACK
    </text>
  </g>

  <!-- Divider -->
  <line x1="32" y1="64" x2="768" y2="64" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- LEFT SECTION: VINYL / ALBUM-ART CONCENTRIC MACRO RINGS -->
  <g id="ringsGroup" filter="url(#albumShadow)">
    <!-- Background disc simulating vinyl album art -->
    <circle cx="175" cy="205" r="106" fill="#090d16" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
    <circle cx="175" cy="205" r="22" fill="#020617" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    
      <!-- Track -->
      <circle cx="175" cy="205" r="92" fill="none" stroke="#064e3b" stroke-width="14" stroke-opacity="0.45"/>
      <!-- Filled Arc -->
      <circle cx="175" cy="205" r="92" fill="none" stroke="#1db954" stroke-width="14"
        stroke-dasharray="578.1" stroke-dashoffset="225.4"
        stroke-linecap="round"
        transform="rotate(-90 175 205)"/>
      
      <!-- Track -->
      <circle cx="175" cy="205" r="72" fill="none" stroke="#164e63" stroke-width="12" stroke-opacity="0.45"/>
      <!-- Filled Arc -->
      <circle cx="175" cy="205" r="72" fill="none" stroke="#06b6d4" stroke-width="12"
        stroke-dasharray="452.4" stroke-dashoffset="86.0"
        stroke-linecap="round"
        transform="rotate(-90 175 205)"/>
      
      <!-- Track -->
      <circle cx="175" cy="205" r="54" fill="none" stroke="#78350f" stroke-width="10" stroke-opacity="0.45"/>
      <!-- Filled Arc -->
      <circle cx="175" cy="205" r="54" fill="none" stroke="#f59e0b" stroke-width="10"
        stroke-dasharray="339.3" stroke-dashoffset="95.0"
        stroke-linecap="round"
        transform="rotate(-90 175 205)"/>
      
      <!-- Track -->
      <circle cx="175" cy="205" r="38" fill="none" stroke="#831843" stroke-width="9" stroke-opacity="0.45"/>
      <!-- Filled Arc -->
      <circle cx="175" cy="205" r="38" fill="none" stroke="#ec4899" stroke-width="9"
        stroke-dasharray="238.8" stroke-dashoffset="76.4"
        stroke-linecap="round"
        transform="rotate(-90 175 205)"/>
      

    <!-- Center Display: Calories Left -->
    <text x="175" y="197" class="mono-bold" font-size="28" text-anchor="middle" fill="#ffffff">
      940
    </text>
    <text x="175" y="217" class="sub-text" font-size="10" text-anchor="middle" fill="#94a3b8">
      KCAL LEFT
    </text>
    <text x="175" y="233" class="mono-bold" font-size="12" text-anchor="middle" fill="#1db954">
      61% MET
    </text>
  </g>

  <!-- CENTER SECTION: "NOW PLAYING" MACRO BARS (Spotify Scrubber Style) -->
  <g transform="translate(320, 78)">
    <text x="0" y="14" class="title-bold" font-size="14" fill="#f8fafc">NOW TRACKING · DAILY FUEL</text>

    <!-- Calories Bar Row -->
    <g transform="translate(0, 30)">
      <circle cx="8" cy="8" r="6" fill="#1db954"/>
      <text x="22" y="12" class="title-med" font-size="13">Calories</text>
      <text x="210" y="12" class="mono" font-size="12" text-anchor="end" fill="#ffffff">1480 / 2420 kcal</text>
      <rect x="22" y="20" width="190" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
      <rect x="22" y="20" width="115.89999999999999" height="6" rx="3" fill="#1db954"/>
      <text x="220" y="26" class="mono" font-size="10" fill="#a1a1aa">61%</text>
    </g>

    <!-- Protein Bar Row -->
    <g transform="translate(0, 70)">
      <circle cx="8" cy="8" r="6" fill="#06b6d4"/>
      <text x="22" y="12" class="title-med" font-size="13">Protein</text>
      <text x="210" y="12" class="mono" font-size="12" text-anchor="end" fill="#ffffff">118g / 145g</text>
      <rect x="22" y="20" width="190" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
      <rect x="22" y="20" width="153.9" height="6" rx="3" fill="#06b6d4"/>
      <text x="220" y="26" class="mono" font-size="10" fill="#a1a1aa">81%</text>
    </g>

    <!-- Carbs Bar Row -->
    <g transform="translate(0, 110)">
      <circle cx="8" cy="8" r="6" fill="#f59e0b"/>
      <text x="22" y="12" class="title-med" font-size="13">Carbs</text>
      <text x="210" y="12" class="mono" font-size="12" text-anchor="end" fill="#ffffff">152g / 210g</text>
      <rect x="22" y="20" width="190" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
      <rect x="22" y="20" width="136.79999999999998" height="6" rx="3" fill="#f59e0b"/>
      <text x="220" y="26" class="mono" font-size="10" fill="#a1a1aa">72%</text>
    </g>

    <!-- Fat Bar Row -->
    <g transform="translate(0, 150)">
      <circle cx="8" cy="8" r="6" fill="#ec4899"/>
      <text x="22" y="12" class="title-med" font-size="13">Healthy Fats</text>
      <text x="210" y="12" class="mono" font-size="12" text-anchor="end" fill="#ffffff">44g / 65g</text>
      <rect x="22" y="20" width="190" height="6" rx="3" fill="rgba(255,255,255,0.12)"/>
      <rect x="22" y="20" width="129.20000000000002" height="6" rx="3" fill="#ec4899"/>
      <text x="220" y="26" class="mono" font-size="10" fill="#a1a1aa">68%</text>
    </g>
  </g>

  <!-- RIGHT SECTION: "WHAT NUTRITION I ATE" (Spotify Track Queue Style) -->
  <g transform="translate(585, 78)">
    <rect x="0" y="0" width="185" height="216" rx="16" fill="rgba(15, 23, 42, 0.70)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <text x="14" y="24" class="title-bold" font-size="12" fill="#38bdf8">🍽️ WHAT YOU ATE</text>
    <text x="14" y="38" class="sub-text" font-size="10">Today's Meal Queue</text>

    <!-- Foods List (Track Queue) -->
    
    <g transform="translate(14, 50)">
      <rect x="0" y="0" width="157" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
      <!-- Track Number -->
      <text x="8" y="20" class="mono-bold" font-size="10" fill="#1db954">1</text>
      <!-- Food Name -->
      <text x="24" y="16" class="title-med" font-size="11" fill="#f1f5f9">
        Grilled Chicke…
      </text>
      <!-- Meal Type -->
      <text x="24" y="27" class="sub-text" font-size="9" fill="#94a3b8">
        Lunch
      </text>
      <!-- Calories as Duration -->
      <text x="148" y="20" class="mono-bold" font-size="11" text-anchor="end" fill="#1db954">
        520 <tspan font-size="8" fill="#64748b">kcal</tspan>
      </text>
    </g>
    
    <g transform="translate(14, 88)">
      <rect x="0" y="0" width="157" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
      <!-- Track Number -->
      <text x="8" y="20" class="mono-bold" font-size="10" fill="#1db954">2</text>
      <!-- Food Name -->
      <text x="24" y="16" class="title-med" font-size="11" fill="#f1f5f9">
        Blueberry Prot…
      </text>
      <!-- Meal Type -->
      <text x="24" y="27" class="sub-text" font-size="9" fill="#94a3b8">
        Breakfast
      </text>
      <!-- Calories as Duration -->
      <text x="148" y="20" class="mono-bold" font-size="11" text-anchor="end" fill="#1db954">
        380 <tspan font-size="8" fill="#64748b">kcal</tspan>
      </text>
    </g>
    
    <g transform="translate(14, 126)">
      <rect x="0" y="0" width="157" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
      <!-- Track Number -->
      <text x="8" y="20" class="mono-bold" font-size="10" fill="#1db954">3</text>
      <!-- Food Name -->
      <text x="24" y="16" class="title-med" font-size="11" fill="#f1f5f9">
        Greek Yogurt &…
      </text>
      <!-- Meal Type -->
      <text x="24" y="27" class="sub-text" font-size="9" fill="#94a3b8">
        Snack
      </text>
      <!-- Calories as Duration -->
      <text x="148" y="20" class="mono-bold" font-size="11" text-anchor="end" fill="#1db954">
        260 <tspan font-size="8" fill="#64748b">kcal</tspan>
      </text>
    </g>
    
    <g transform="translate(14, 164)">
      <rect x="0" y="0" width="157" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
      <!-- Track Number -->
      <text x="8" y="20" class="mono-bold" font-size="10" fill="#1db954">4</text>
      <!-- Food Name -->
      <text x="24" y="16" class="title-med" font-size="11" fill="#f1f5f9">
        Almonds & Bana…
      </text>
      <!-- Meal Type -->
      <text x="24" y="27" class="sub-text" font-size="9" fill="#94a3b8">
        Snack
      </text>
      <!-- Calories as Duration -->
      <text x="148" y="20" class="mono-bold" font-size="11" text-anchor="end" fill="#1db954">
        320 <tspan font-size="8" fill="#64748b">kcal</tspan>
      </text>
    </g>
    
  </g>

  <!-- BOTTOM SPOTIFY PLAYER CONTROLS & STATS STRIP -->
  <g transform="translate(32, 326)">
    <!-- Pill 1: Eaten Calories -->
    <rect x="0" y="0" width="170" height="52" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="16" y="20" class="sub-text" font-size="10">EATEN TODAY</text>
    <text x="16" y="40" class="mono-bold" font-size="16" fill="#1db954">1480 <tspan font-size="10" fill="#64748b">kcal</tspan></text>

    <!-- Pill 2: Workout Burn -->
    <rect x="188" y="0" width="170" height="52" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="204" y="20" class="sub-text" font-size="10">WORKOUT BURN</text>
    <text x="204" y="40" class="mono-bold" font-size="16" fill="#fb923c">-320 <tspan font-size="10" fill="#64748b">kcal</tspan></text>

    <!-- Pill 3: Hydration -->
    <rect x="376" y="0" width="170" height="52" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="392" y="20" class="sub-text" font-size="10">HYDRATION</text>
    <text x="392" y="40" class="mono-bold" font-size="16" fill="#38bdf8">1750 <tspan font-size="10" fill="#64748b">ml</tspan></text>

    <!-- Pill 4: Goal Streak -->
    <rect x="564" y="0" width="172" height="52" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="580" y="20" class="sub-text" font-size="10">PERFECT STREAK</text>
    <text x="580" y="40" class="mono-bold" font-size="16" fill="#f59e0b">🔥 5 <tspan font-size="10" fill="#64748b">days</tspan></text>
  </g>

  <!-- Bottom Brand Subtitle -->
  <text x="400" y="422" class="sub-text" font-size="10" text-anchor="middle" fill="#64748b">
    NutriPulse · Live Spotify-Style Background Tracker · Pinned Notification
  </text>
</svg>
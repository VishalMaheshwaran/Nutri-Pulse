<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#020617"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="180" stroke="url(#grad1)" stroke-width="20" stroke-linecap="round" stroke-dasharray="800 200" filter="url(#glow)"/>
  
  <!-- Pulse Waveform & Leaf / Flame Mark -->
  <path d="M 140 256 L 200 256 L 225 190 L 265 330 L 295 230 L 320 256 L 372 256" stroke="#34d399" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Calorie Flame Accent -->
  <path d="M 256 120 C 270 150 290 170 280 200 C 272 185 260 175 256 160 C 250 178 240 188 232 200 C 220 170 242 150 256 120 Z" fill="url(#flameGrad)" />
</svg>
